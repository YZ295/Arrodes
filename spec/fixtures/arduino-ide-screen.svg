  <g font-family="Consolas, monospace" font-size="20">
    <text x="72" y="176" fill="#67d8ef">void <tspan fill="#f4f7f8">setup() {</tspan></text>
    <text x="104" y="204" fill="#f0c674">pinMode<tspan fill="#f4f7f8">(LED_BUILTIN, OUTPUT);</tspan></text>
    <text x="72" y="232" fill="#f4f7f8">}</text>
    <text x="72" y="288" fill="#67d8ef">void <tspan fill="#f4f7f8">loop() {</tspan></text>
    <text x="104" y="316" fill="#f0c674">digitalWrite<tspan fill="#f4f7f8">(LED_BUILTIN, HIGH);</tspan></text>
    <text x="104" y="344" fill="#f0c674">delay<tspan fill="#f4f7f8">(1000);</tspan></text>
    <text x="104" y="372" fill="#f0c674">digitalWrite<tspan fill="#f4f7f8">(LED_BUILTIN, LOW);</tspan></text>
    <text x="104" y="400" fill="#f0c674">delay<tspan fill="#f4f7f8">(1000);</tspan></text>
    <text x="72" y="428" fill="#f4f7f8">}</text>
  </g>
